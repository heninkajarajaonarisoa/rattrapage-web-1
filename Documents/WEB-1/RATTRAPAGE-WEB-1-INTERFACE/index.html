<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Courses - HEI</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <main class="main-container">
    <section class="filter-card">
      <div class="filter-group group-lang">
        <label>LANGUAGE</label>
        <div class="lang-flags">
          <button class="flag-btn" data-lang="MG" title="Malagasy">
            <img src="https://flagcdn.com/w40/mg.png" alt="Madagascar">
          </button>
          <button class="flag-btn" data-lang="FR" title="Français">
            <img src="https://flagcdn.com/w40/fr.png" alt="France">
          </button>
          <button class="flag-btn" data-lang="EN" title="English">
            <img src="https://flagcdn.com/w40/us.png" alt="USA">
          </button>
        </div>
      </div>

      <div class="filter-group group-select">
        <label for="tech-select">TECHNOLOGY</label>
        <select id="tech-select">
          <option value="all">All technologies</option>
          <option value="javascript">JavaScript</option>
          <option value="java">Java</option>
          <option value="sql">SQL</option>
        </select>
      </div>

      <div class="filter-group group-select">
        <label for="level-select">LEVEL</label>
        <select id="level-select">
          <option value="all">All levels</option>
          <option value="beginner">Beginner</option>
          <option value="intermediate">Intermediate</option>
          <option value="advanced">Advanced</option>
        </select>
      </div>
    </section>
  </main>

  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
